<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Caffeine budget</title>
<style>
:root{--bg:#050807;--panel:#0d1311;--panel2:#141c19;--ink:#f1f6f4;--muted:#9fb0a9;--line:#27322e;--cyan:#44ffff;--amber:#ffb454;--red:#ff6b57;--ok:#5be0a4}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Montserrat,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
body{padding:14px}
[dir=rtl] body{font-family:"Segoe UI",Tahoma,"Noto Sans Arabic",system-ui,sans-serif}
#app{max-width:760px;margin:0 auto}
h1{font-size:22px;margin:0 0 4px;font-weight:600}
.sub{color:var(--muted);margin:0 0 14px;font-size:14px}
h2{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:18px 0 8px;font-weight:600}
[dir=rtl] h2{letter-spacing:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
button,select{font:inherit;color:inherit}
.drink{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;text-align:start;cursor:pointer}
.drink:hover,.drink:focus-visible{border-color:var(--cyan);outline:none}
.drink b{display:block;font-size:14px;font-weight:600}
.drink small{color:var(--muted);font-size:12px}
.drink .mg{color:var(--cyan);font-weight:600;font-size:13px}
.drink.caffy{border-color:#2a6b6b}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
label{font-size:13px;color:var(--muted)}
select{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:13px}
.pill[aria-pressed=true]{background:var(--cyan);color:#001;border-color:var(--cyan);font-weight:600}
ul.list{list-style:none;margin:0;padding:0}
ul.list li{display:flex;justify-content:space-between;gap:8px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 10px;margin-bottom:6px;font-size:14px}
ul.list .x{background:none;border:1px solid var(--line);border-radius:6px;cursor:pointer;padding:2px 9px}
.empty{color:var(--muted);font-size:14px;padding:6px 0}
.meter{background:var(--panel2);border-radius:999px;height:14px;overflow:hidden;border:1px solid var(--line)}
.meter i{display:block;height:100%;background:var(--ok);width:0}
.meter.over i{background:var(--red)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-top:10px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.stat span{display:block;color:var(--muted);font-size:12px}
.stat b{font-size:20px;font-weight:600}
.note{background:var(--panel);border-inline-start:3px solid var(--amber);padding:9px 12px;border-radius:6px;font-size:13px;margin-top:8px}
.note.bad{border-color:var(--red)}
svg{width:100%;height:auto;display:block;background:var(--panel);border:1px solid var(--line);border-radius:10px}
.src{font-size:12px;color:var(--muted);margin-top:16px}
.src a{color:var(--cyan)}
.foot{margin-top:18px;padding-top:12px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.foot a{color:var(--cyan)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
@media (prefers-reduced-motion:no-preference){.meter i{transition:width .3s}}
</style>
</head>
<body>
<div id="app"></div>
