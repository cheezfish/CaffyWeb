<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Caffeine budget</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&family=Ubuntu+Mono:wght@400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#020912; --glass:rgba(255,255,255,.035); --glass2:rgba(255,255,255,.06);
  --ink:#f2f6fa; --mute:#9aa7b4; --dim:#5b6877; --line:rgba(255,255,255,.09);
  --cyan:#00ffff; --amber:#ffb86b; --red:#ff7a7a; --ok:#39e0b0;
  --navy:#091540; --cream:#f3f0e9; --wk:#2f97c1;
  --pad:22px; --r:14px;
  --sans:Montserrat,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --mono:"Ubuntu Mono",ui-monospace,Menlo,monospace;
}
[dir=rtl]{--sans:"Noto Sans Arabic","Segoe UI",Tahoma,system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:transparent;color:var(--ink);font-family:var(--sans);font-weight:300;line-height:1.55;-webkit-font-smoothing:antialiased}
body{padding:0}
#app{max-width:760px;margin:0 auto;border:1px solid var(--line);border-radius:18px;overflow:hidden;background:linear-gradient(180deg,rgba(255,255,255,.025),rgba(255,255,255,0) 40%),var(--bg)}
.body{padding:var(--pad)}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--cyan)}
[dir=rtl] .eyebrow{letter-spacing:0;font-family:var(--sans);font-size:12px}
h1{font-size:30px;line-height:1.15;font-weight:300;margin:6px 0 8px;letter-spacing:-.01em}
.sub{margin:0;color:var(--mute);font-size:14.5px;max-width:560px}
.card{background:var(--glass);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-top:14px}
.lab{font-family:var(--mono);font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--mute);margin:0 0 12px}
[dir=rtl] .lab{letter-spacing:0;font-family:var(--sans);font-size:12.5px}
/* stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin-top:14px;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--glass)}
.stat{padding:16px 16px 14px;border-inline-end:1px solid var(--line)}
.stat:last-child{border-inline-end:0}
.stat small{display:block;color:var(--mute);font-size:12px;margin-bottom:4px}
.stat b{font-size:34px;font-weight:300;letter-spacing:-.02em;line-height:1.05}
.stat b i{font-style:normal;font-size:13px;color:var(--mute);margin-inline-start:4px;font-weight:400}
.stat em{display:block;font-style:normal;color:var(--dim);font-size:12px;margin-top:4px}
.stat.bad b{color:var(--red)}
.stat.sleep b{color:var(--amber)}
.meterwrap{margin-top:14px}
.meter{position:relative;height:6px;background:var(--glass2);border-radius:99px;overflow:hidden}
.meter i{position:absolute;inset-block:0;inset-inline-start:0;background:linear-gradient(90deg,#00b8c4,var(--cyan));border-radius:99px;width:0}
.meter.over i{background:linear-gradient(90deg,#ff9a7a,var(--red))}
.metermeta{display:flex;justify-content:space-between;color:var(--mute);font-size:12px;margin-top:8px}
@media (prefers-reduced-motion:no-preference){.meter i{transition:width .45s cubic-bezier(.2,.8,.2,1)}}
/* notes */
.note{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;color:var(--ink);margin-top:12px;padding:11px 13px;border-radius:10px;background:var(--glass);border:1px solid var(--line)}
.note svg{flex:none;margin-top:2px}
.note.warn{border-color:rgba(255,184,107,.35);background:rgba(255,184,107,.06)}
.note.bad{border-color:rgba(255,122,122,.4);background:rgba(255,122,122,.07)}
/* chart */
.chartbox{position:relative}
.chart{width:100%;height:auto;display:block;direction:ltr;touch-action:pan-y}
.tip{position:absolute;pointer-events:none;background:#0a1626;border:1px solid var(--line);border-radius:8px;padding:5px 9px;font-size:12px;white-space:nowrap;transform:translate(-50%,-110%);opacity:0;transition:opacity .12s}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:10px;font-size:12px;color:var(--mute)}
.legend span:before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;margin-inline-end:6px;background:var(--cyan);vertical-align:-1px}
.legend .s:before{background:var(--amber)}.legend .p:before{background:#fff}
/* add */
.when{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:6px}
.when output{font-size:30px;font-weight:300;letter-spacing:-.01em;direction:ltr}
.when span{color:var(--mute);font-size:13px}
.slider{direction:ltr}
input[type=range]{--p:0%;-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:4px;background:linear-gradient(90deg,var(--cyan) var(--p),var(--glass2) var(--p));border-radius:99px}
input[type=range]::-moz-range-track{height:4px;background:var(--glass2);border-radius:99px}
input[type=range]::-moz-range-progress{height:4px;background:var(--cyan);border-radius:99px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;margin-top:-9px;border-radius:50%;background:var(--cyan);border:3px solid var(--bg);box-shadow:0 0 0 1px var(--cyan),0 0 16px rgba(0,255,255,.35)}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--cyan);border:3px solid var(--bg);box-shadow:0 0 0 1px var(--cyan)}
input[type=range]:focus-visible{outline:2px solid var(--cyan);outline-offset:4px;border-radius:6px}
.ticks{display:flex;justify-content:space-between;color:var(--dim);font-size:11px;direction:ltr;margin-top:-2px}
.drinks{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:10px;margin-top:16px}
.drink{position:relative;display:flex;flex-direction:column;gap:2px;text-align:start;background:var(--glass);border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;color:inherit;font:inherit;transition:border-color .15s,background .15s,transform .15s}
.drink:hover{border-color:rgba(0,255,255,.5);background:rgba(0,255,255,.05)}
.drink:active{transform:scale(.98)}
.drink:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.drink svg{width:26px;height:26px;color:var(--mute);margin-bottom:6px}
.drink:hover svg{color:var(--cyan)}
.drink b{font-weight:500;font-size:13.5px}
.drink small{color:var(--mute);font-size:12px}
.drink .mg{margin-top:6px;font-family:var(--mono);font-size:14px;color:var(--cyan)}
[dir=rtl] .drink .mg{font-family:var(--sans)}
.drink.caffy{border-color:rgba(0,255,255,.38);background:linear-gradient(160deg,rgba(0,255,255,.09),rgba(0,255,255,.02))}
.drink.caffy svg{color:var(--cyan)}
.drink .tag{position:absolute;top:10px;inset-inline-end:10px;font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:#001;background:var(--cyan);border-radius:3px;padding:1px 5px}
[dir=rtl] .drink .tag{letter-spacing:0;font-family:var(--sans)}
/* day list */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;background:var(--glass);border:1px solid var(--line);border-radius:99px;padding:5px 6px 5px 12px;font-size:13px}
[dir=rtl] .chip{padding:5px 12px 5px 6px}
.chip time{font-family:var(--mono);color:var(--cyan);direction:ltr}
[dir=rtl] .chip time{font-family:var(--sans)}
.chip button{width:22px;height:22px;border-radius:50%;border:0;background:var(--glass2);color:var(--mute);cursor:pointer;font-size:14px;line-height:1;padding:0}
.chip button:hover{background:rgba(255,122,122,.25);color:#fff}
.empty{color:var(--dim);font-size:13.5px}
/* settings */
.row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0;padding-top:0}
.row label,.row .t{font-size:14px}
.row .d{display:block;color:var(--mute);font-size:12px}
.seg{display:inline-flex;background:var(--glass2);border-radius:10px;padding:3px}
.seg button{border:0;background:transparent;color:var(--mute);font:inherit;font-size:13px;padding:7px 14px;border-radius:8px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--cyan);color:#001;font-weight:500}
.seg button:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
select{font:inherit;font-size:14px;color:var(--ink);background:var(--glass2);border:1px solid var(--line);border-radius:10px;padding:8px 12px;direction:ltr}
select:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.switch{position:relative;width:44px;height:26px;flex:none}
.switch input{position:absolute;inset:0;opacity:0;cursor:pointer;margin:0}
.switch i{position:absolute;inset:0;background:var(--glass2);border:1px solid var(--line);border-radius:99px;transition:background .2s}
.switch i:after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:18px;height:18px;border-radius:50%;background:var(--ink);transition:transform .2s}
.switch input:checked + i{background:var(--cyan);border-color:var(--cyan)}
.switch input:checked + i:after{background:#001;transform:translateX(18px)}
[dir=rtl] .switch input:checked + i:after{transform:translateX(-18px)}
.switch input:focus-visible + i{outline:2px solid var(--cyan);outline-offset:2px}
/* method */
details.m{margin-top:14px;border:1px solid var(--line);border-radius:var(--r);background:var(--glass)}
details.m summary{cursor:pointer;padding:14px 18px;font-size:14px;list-style:none;display:flex;justify-content:space-between;align-items:center}
details.m summary::-webkit-details-marker{display:none}
details.m summary:after{content:"+";font-family:var(--mono);font-size:20px;color:var(--cyan);line-height:1}
details.m[open] summary:after{content:"–"}
details.m .in{padding:0 18px 16px;color:var(--mute);font-size:13px}
details.m a{color:var(--cyan);text-decoration:none;border-bottom:1px solid rgba(0,255,255,.3)}
details.m p{margin:8px 0}
/* wiskers credit bar */
.credit{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;background:var(--navy);border-top:1px solid rgba(243,240,233,.14);padding:14px var(--pad);margin-top:var(--pad)}
.credit a{display:flex;align-items:center;gap:14px;text-decoration:none;color:var(--cream)}
.credit img{height:22px;width:auto;display:block}
.credit .sep{width:1px;height:18px;background:rgba(243,240,233,.25)}
.credit span{font-size:12px;color:rgba(243,240,233,.72);letter-spacing:.01em}
.credit .go{font-size:12px;color:#6cc3e6;text-decoration:none;font-weight:500}
.credit .go:hover{text-decoration:underline}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
@media (max-width:560px){
  :root{--pad:16px}
  h1{font-size:25px}
  .stat{padding:13px 11px 11px}.stat b{font-size:26px}.stat b i{display:block;margin:0}
  .drinks{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
